<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
<defs><style>.bg{fill:#0b1220}.n{fill:#182a43;stroke:#60a5fa;stroke-width:2}.done{fill:#15392f;stroke:#34d399;stroke-width:2}.t{font:bold 23px Arial;fill:#f8fafc}.s{font:17px Arial;fill:#dbeafe}.a{stroke:#94a3b8;stroke-width:3;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#94a3b8"/></marker></defs>
<rect class="bg" width="1200" height="430" rx="22"/><text class="t" x="600" y="55" text-anchor="middle" style="font-size:30px">Ciclo de vida de uma tarefa</text>
<rect class="n" x="45" y="150" width="230" height="120" rx="16"/><text class="t" x="160" y="195" text-anchor="middle">Pendente</text><text class="s" x="160" y="230" text-anchor="middle">Criada pela operação</text>
<rect class="n" x="345" y="150" width="230" height="120" rx="16"/><text class="t" x="460" y="195" text-anchor="middle">Atribuída</text><text class="s" x="460" y="230" text-anchor="middle">Responsável definido</text>
<rect class="n" x="645" y="150" width="230" height="120" rx="16"/><text class="t" x="760" y="195" text-anchor="middle">Em execução</text><text class="s" x="760" y="230" text-anchor="middle">Reposição iniciada</text>
<rect class="done" x="945" y="150" width="210" height="120" rx="16"/><text class="t" x="1050" y="195" text-anchor="middle">Concluída</text><text class="s" x="1050" y="230" text-anchor="middle">Confirmação registada</text>
<path class="a" d="M275 210 H335"/><path class="a" d="M575 210 H635"/><path class="a" d="M875 210 H935"/>
<text class="s" x="600" y="340" text-anchor="middle">Cada transição deve guardar data/hora e utilizador responsável.</text><text class="s" x="600" y="370" text-anchor="middle">Cancelamentos e reaberturas serão tratados com histórico auditável.</text>
</svg>