<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Fluxo de decisão do portefólio de rotação de paletes</title>
<desc id="desc">Fluxo consultivo que avalia limiar de meia palete, risco de rutura, tráfego, palete de substituição, espaço de retaguarda e custo operacional antes de recomendar uma troca.</desc>
<defs><style>
.bg{fill:#0b1220}.panel{fill:#152238;stroke:#45617f;stroke-width:2}.decision{fill:#243b57;stroke:#8bb8df;stroke-width:2}.safe{fill:#153b36;stroke:#53c6a4;stroke-width:2}.warn{fill:#49351d;stroke:#e6b65c;stroke-width:2}.txt{font: bold 22px Arial,sans-serif;fill:#f4f7fb}.sub{font:16px Arial,sans-serif;fill:#c7d4e4}.line{stroke:#9bb4cc;stroke-width:3;fill:none;marker-end:url(#arrow)}.yes{font:bold 15px Arial;fill:#72d6b5}.no{font:bold 15px Arial;fill:#f0c36b}
</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6Z" fill="#9bb4cc"/></marker></defs>
<rect class="bg" width="1200" height="700" rx="24"/>
<text class="txt" x="600" y="48" text-anchor="middle" font-size="30">SMART SHELF AI · PALLET ROTATION</text>
<text class="sub" x="600" y="77" text-anchor="middle">Priorização consultiva — sem movimentação automática de stock</text>
<rect class="panel" x="390" y="105" width="420" height="72" rx="14"/><text class="txt" x="600" y="136" text-anchor="middle">Palete em exposição</text><text class="sub" x="600" y="160" text-anchor="middle">Produto elegível + residual confirmado</text>
<path class="line" d="M600 177 V211"/>
<path class="decision" d="M600 211 L760 270 L600 329 L440 270Z"/><text class="txt" x="600" y="263" text-anchor="middle">Residual ≤ 50%?</text><text class="sub" x="600" y="286" text-anchor="middle">Limiar configurável</text>
<path class="line" d="M440 270 H210 V365"/><text class="no" x="300" y="254">NÃO</text>
<rect class="warn" x="65" y="365" width="290" height="92" rx="14"/><text class="txt" x="210" y="402" text-anchor="middle">Manter palete atual</text><text class="sub" x="210" y="428" text-anchor="middle">Reposição convencional</text>
<path class="line" d="M760 270 H990 V365"/><text class="yes" x="860" y="254">SIM</text>
<rect class="panel" x="830" y="365" width="320" height="92" rx="14"/><text class="txt" x="990" y="400" text-anchor="middle">Avaliar operação</text><text class="sub" x="990" y="427" text-anchor="middle">Procura até janela + tráfego</text>
<path class="line" d="M990 457 V490"/>
<path class="decision" d="M990 490 L1140 550 L990 610 L840 550Z"/><text class="txt" x="990" y="545" text-anchor="middle">Todos os recursos?</text><text class="sub" x="990" y="568" text-anchor="middle">Palete pronta + espaço</text>
<path class="line" d="M840 550 H600 V630"/><text class="no" x="710" y="534">NÃO</text>
<rect class="warn" x="430" y="630" width="340" height="54" rx="12"/><text class="txt" x="600" y="664" text-anchor="middle">Preparar / repor / rever dados</text>
<path class="line" d="M1140 550 H1170 V270 H810"/><text class="yes" x="1080" y="520">SIM</text>
<rect class="safe" x="390" y="365" width="350" height="92" rx="14"/><text class="txt" x="565" y="402" text-anchor="middle">Comparar tempos e custos</text><text class="sub" x="565" y="428" text-anchor="middle">Inclui transporte + recomposição</text>
<path class="line" d="M565 457 V510"/>
<rect class="safe" x="390" y="510" width="350" height="92" rx="14"/><text class="txt" x="565" y="548" text-anchor="middle">Recomendar troca</text><text class="sub" x="565" y="575" text-anchor="middle">Só se poupar tempo e for segura</text>
<text class="sub" x="600" y="690" text-anchor="middle">A palete parcial regressa à retaguarda para recomposição e reutilização.</text>
</svg>