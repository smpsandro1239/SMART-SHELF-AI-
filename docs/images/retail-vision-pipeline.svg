<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Pipeline de visão computacional do SMART-SHELF-AI</title>
<desc id="desc">Fluxo da imagem da prateleira até deteção, recorte, embedding, matching conservador, revisão humana e decisão de reposição baseada em inventário.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
<rect width="1200" height="560" rx="24" fill="#f8fafc"/>
<text x="600" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#0f172a">SMART-SHELF-AI · Pipeline de visão</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="40" y="115" width="170" height="110" rx="15" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="125" y="155" font-size="18" font-weight="700" fill="#1e3a8a">Imagem</text><text x="125" y="182" font-size="14" fill="#1e40af">captura + hash</text><text x="125" y="202" font-size="12" fill="#1e40af">loja / prateleira</text>
<rect x="255" y="115" width="170" height="110" rx="15" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/><text x="340" y="155" font-size="18" font-weight="700" fill="#312e81">Detetor</text><text x="340" y="182" font-size="14" fill="#3730a3">caixas + confiança</text><text x="340" y="202" font-size="12" fill="#3730a3">modelo versionado</text>
<rect x="470" y="115" width="170" height="110" rx="15" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="555" y="155" font-size="18" font-weight="700" fill="#4c1d95">Recortes</text><text x="555" y="182" font-size="14" fill="#5b21b6">um crop por produto</text><text x="555" y="202" font-size="12" fill="#5b21b6">normalização</text>
<rect x="685" y="115" width="170" height="110" rx="15" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/><text x="770" y="155" font-size="18" font-weight="700" fill="#581c87">Embedding</text><text x="770" y="182" font-size="14" fill="#6b21a8">DINO / encoder</text><text x="770" y="202" font-size="12" fill="#6b21a8">vetor + versão</text>
<rect x="900" y="115" width="250" height="110" rx="15" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="1025" y="155" font-size="18" font-weight="700" fill="#14532d">Matching SKU</text><text x="1025" y="182" font-size="14" fill="#166534">similaridade + margem</text><text x="1025" y="202" font-size="12" fill="#166534">exemplares aprovados</text>
<g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M210 170 H250"/><path d="M425 170 H465"/><path d="M640 170 H680"/><path d="M855 170 H895"/></g>
<path d="M1025 225 V300 H790 V345" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="650" y="345" width="280" height="105" rx="15" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="790" y="382" font-size="18" font-weight="700" fill="#78350f">Revisão humana</text><text x="790" y="409" font-size="14" fill="#92400e">AMBIGUOUS / UNKNOWN</text><text x="790" y="430" font-size="12" fill="#92400e">feedback auditável</text>
<path d="M1025 225 V300 H1060 V345" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="955" y="345" width="205" height="105" rx="15" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="1057" y="382" font-size="17" font-weight="700" fill="#134e4a">Observação</text><text x="1057" y="409" font-size="14" fill="#115e59">visual + timestamp</text><text x="1057" y="430" font-size="12" fill="#115e59">não é stock real</text>
<path d="M1057 450 V490 H790" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="480" y="475" width="310" height="60" rx="13" fill="#e2e8f0" stroke="#475569" stroke-width="2"/><text x="635" y="500" font-size="16" font-weight="700" fill="#0f172a">Motor de reposição</text><text x="635" y="520" font-size="12" fill="#334155">observação recente + inventário disponível</text>
<text x="600" y="85" font-size="13" fill="#475569">Abstenção é um resultado válido: nunca forçar uma identificação incerta.</text>
</g></svg>