<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo de aprovação do dataset SMART SHELF AI</title>
  <desc id="desc">Fluxo de recolha autorizada, preparação e anotação, validação COCO e manifesto, auditoria de leakage e qualidade, revisão humana e decisão separada para treino e inferência operacional.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <style>
      .bg{fill:#f8fafc}.node{fill:#fff;stroke:#334155;stroke-width:2;rx:16}.gate{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:16}.human{fill:#fff7ed;stroke:#c2410c;stroke-width:2;rx:16}.title{font:700 20px Arial,sans-serif;fill:#0f172a}.sub{font:15px Arial,sans-serif;fill:#334155}.small{font:13px Arial,sans-serif;fill:#475569}.line{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}.label{font:700 14px Arial,sans-serif;fill:#334155}
    </style>
  </defs>
  <rect class="bg" width="1200" height="520" rx="22"/>
  <text x="48" y="48" class="title">SMART SHELF AI — aprovação de uma versão do dataset</text>
  <rect class="node" x="45" y="95" width="245" height="105"/>
  <text x="167" y="128" text-anchor="middle" class="title">1. Recolha autorizada</text>
  <text x="167" y="155" text-anchor="middle" class="sub">Origem, direitos e finalidade</text>
  <text x="167" y="178" text-anchor="middle" class="small">Sem dados pessoais desnecessários</text>
  <rect class="node" x="345" y="95" width="245" height="105"/>
  <text x="467" y="128" text-anchor="middle" class="title">2. Preparação</text>
  <text x="467" y="155" text-anchor="middle" class="sub">Privacidade e anotação COCO</text>
  <text x="467" y="178" text-anchor="middle" class="small">Manifesto SHA-256</text>
  <rect class="gate" x="645" y="95" width="245" height="105"/>
  <text x="767" y="128" text-anchor="middle" class="title">3. Auditorias técnicas</text>
  <text x="767" y="155" text-anchor="middle" class="sub">COCO + integridade + leakage</text>
  <text x="767" y="178" text-anchor="middle" class="small">Distribuição e qualidade</text>
  <rect class="human" x="945" y="95" width="210" height="105"/>
  <text x="1050" y="128" text-anchor="middle" class="title">4. Revisão humana</text>
  <text x="1050" y="155" text-anchor="middle" class="sub">Técnica + privacidade/licença</text>
  <text x="1050" y="178" text-anchor="middle" class="small">Decisões e responsáveis</text>
  <path class="line" d="M290 147 H338"/><path class="line" d="M590 147 H638"/><path class="line" d="M890 147 H938"/>
  <path class="line" d="M1050 200 V270 H350 V315"/>
  <text x="690" y="258" class="label">Todos os controlos obrigatórios aprovados</text>
  <rect class="gate" x="180" y="315" width="340" height="105"/>
  <text x="350" y="350" text-anchor="middle" class="title">APROVADO PARA TREINO</text>
  <text x="350" y="378" text-anchor="middle" class="sub">Dataset + autorizações + auditorias</text>
  <text x="350" y="400" text-anchor="middle" class="small">Não significa aprovação operacional</text>
  <path class="line" d="M520 367 H650"/>
  <rect class="human" x="660" y="315" width="350" height="105"/>
  <text x="835" y="350" text-anchor="middle" class="title">APROVAÇÃO OPERACIONAL</text>
  <text x="835" y="378" text-anchor="middle" class="sub">Modelo, licença e métricas por classe</text>
  <text x="835" y="400" text-anchor="middle" class="small">Revisão humana separada obrigatória</text>
  <text x="48" y="478" class="small">O gate verifica declarações e artefactos; não autentica documentos legais nem substitui inspeção visual.</text>
</svg>