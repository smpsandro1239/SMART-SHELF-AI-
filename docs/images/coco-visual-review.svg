<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Fluxo de revisão visual das anotações COCO</title>
<desc id="desc">Documento COCO e imagens originais passam pela validação de caminhos, geração de galeria HTML com caixas e revisão humana antes do gate de aprovação.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6" fill="#64748b"/></marker></defs>
<rect width="1200" height="360" rx="18" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" text-anchor="middle">
<g fill="#e0f2fe" stroke="#0284c7" stroke-width="2"><rect x="35" y="105" width="210" height="125" rx="14"/><rect x="285" y="105" width="210" height="125" rx="14"/></g>
<g fill="#fef3c7" stroke="#d97706" stroke-width="2"><rect x="535" y="105" width="210" height="125" rx="14"/></g>
<g fill="#dcfce7" stroke="#16a34a" stroke-width="2"><rect x="785" y="105" width="175" height="125" rx="14"/></g>
<g fill="#f1f5f9" stroke="#64748b" stroke-width="2"><rect x="995" y="105" width="170" height="125" rx="14"/></g>
<g fill="#0f172a" font-size="20" font-weight="700"><text x="140" y="150">COCO + imagens</text><text x="140" y="181" font-size="15" font-weight="400">JSON e ficheiros</text><text x="390" y="150">Validação</text><text x="390" y="181" font-size="15" font-weight="400">estrutura e caminhos</text><text x="640" y="150">Galeria HTML</text><text x="640" y="181" font-size="15" font-weight="400">caixas + classes</text><text x="872" y="150">Revisão</text><text x="872" y="181" font-size="15" font-weight="400">humana</text><text x="1080" y="150">Gate</text><text x="1080" y="181" font-size="15" font-weight="400">aprovação</text></g>
<g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M245 167 H278"/><path d="M495 167 H528"/><path d="M745 167 H778"/><path d="M960 167 H988"/></g>
<text x="600" y="290" fill="#475569" font-size="17">A galeria não altera nem envia as fotografias. A decisão de qualidade continua humana.</text>
</g></svg>