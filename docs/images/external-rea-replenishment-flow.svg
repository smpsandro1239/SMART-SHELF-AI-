<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Síntese da engenharia reversa externa do SMART SHELF AI</title>
<desc id="desc">Integração conceptual entre visão computacional, identificação SKU, consenso temporal, inventário projetado, motor de políticas e tarefa humana.</desc>
<defs><style>
.bg{fill:#f7f9fc}.b{fill:#fff;stroke:#56749b;stroke-width:2}.g{fill:#eaf8f0;stroke:#39966a;stroke-width:2}.a{fill:#fff5df;stroke:#c58a24;stroke-width:2}.p{fill:#f3edff;stroke:#8964c5;stroke-width:2}.t{font:700 19px Arial;fill:#172033}.s{font:14px Arial;fill:#344256}.n{font:12px Arial;fill:#526176}.l{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#ar)}</style><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#64748b"/></marker></defs>
<rect class="bg" width="1200" height="620" rx="20"/>
<text class="t" x="40" y="48" font-size="25">Síntese REA externa — da prateleira à reposição</text>
<text class="n" x="40" y="72">Princípios recolhidos em projetos externos e plataformas ERP; arquitetura proposta, não implantação concluída</text>
<rect class="b" x="40" y="130" width="190" height="115" rx="12"/><text class="t" x="62" y="166">Captura</text><text class="s" x="62" y="194">Câmara / imagem</text><text class="n" x="62" y="220">Keyframes e qualidade</text>
<rect class="b" x="285" y="130" width="190" height="115" rx="12"/><text class="t" x="307" y="166">Deteção</text><text class="s" x="307" y="194">Produto / bbox</text><text class="n" x="307" y="220">Contagem de facings</text>
<rect class="b" x="530" y="130" width="190" height="115" rx="12"/><text class="t" x="552" y="166">SKU + posição</text><text class="s" x="552" y="194">Embeddings / FAISS</text><text class="n" x="552" y="220">Planograma / zona</text>
<rect class="p" x="775" y="130" width="190" height="115" rx="12"/><text class="t" x="797" y="166">Consenso</text><text class="s" x="797" y="194">Tracking temporal</text><text class="n" x="797" y="220">Deduplicar alertas</text>
<rect class="g" x="1010" y="130" width="150" height="115" rx="12"/><text class="t" x="1030" y="166">Evidência</text><text class="s" x="1030" y="194">OSA / gap</text><text class="n" x="1030" y="220">Revisão</text>
<path class="l" d="M230 188 H285"/><path class="l" d="M475 188 H530"/><path class="l" d="M720 188 H775"/><path class="l" d="M965 188 H1010"/>
<rect class="a" x="285" y="350" width="280" height="135" rx="12"/><text class="t" x="310" y="387">Reposição da prateleira</text><text class="s" x="310" y="417">Alvo − quantidade observada</text><text class="s" x="310" y="442">Limitada ao stock de retaguarda</text><text class="n" x="310" y="468">Tarefa interna de refill</text>
<rect class="a" x="650" y="350" width="280" height="135" rx="12"/><text class="t" x="675" y="387">Reaprovisionamento</text><text class="s" x="675" y="417">Stock projetado até à receção</text><text class="s" x="675" y="442">Ponto mínimo / alvo / packs</text><text class="n" x="675" y="468">Compra ou transferência proposta</text>
<rect class="g" x="1010" y="350" width="150" height="135" rx="12"/><text class="t" x="1030" y="387">Operador</text><text class="s" x="1030" y="417">Confirma</text><text class="s" x="1030" y="442">Executa</text><text class="n" x="1030" y="468">Nova captura</text>
<path class="l" d="M1085 245 V300 H425 V350"/><path class="l" d="M1085 300 H790 V350"/><path class="l" d="M565 417 H650"/><path class="l" d="M930 417 H1010"/>
<text class="n" x="40" y="555">Princípio crítico: uma falha visual não é, por si só, uma rutura de inventário. Stock e previsão têm de ser consultados separadamente.</text>
<text class="n" x="40" y="578">O LLM pode ajudar a redigir instruções, mas não deve decidir deteções, quantidades nem movimentos de stock.</text>
</svg>