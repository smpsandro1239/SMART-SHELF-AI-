<defs><style>.bg{fill:#0b1220}.b{fill:#182a43;stroke:#60a5fa;stroke-width:2}.g{fill:#15392f;stroke:#34d399;stroke-width:2}.y{fill:#45351b;stroke:#fbbf24;stroke-width:2}.r{fill:#45252c;stroke:#fb7185;stroke-width:2}.t{font:bold 22px Arial;fill:#f8fafc}.s{font:17px Arial;fill:#dbeafe}.a{stroke:#94a3b8;stroke-width:3;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#94a3b8"/></marker></defs>
