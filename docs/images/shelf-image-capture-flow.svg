<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Fluxo de captura de imagem de prateleira</title><desc id="desc">O utilizador envia uma fotografia, a API valida o formato e tamanho, armazena o ficheiro, regista metadados e deixa a análise pendente para o futuro motor de visão computacional.</desc>
<defs><style>.bg{fill:#f4f7fa}.card{fill:#fff;stroke:#d9e2ec;stroke-width:2}.head{font:700 18px Arial,sans-serif;fill:#172b40}.sub{font:14px Arial,sans-serif;fill:#617386}.num{font:700 13px Arial,sans-serif;fill:#087c58}.arrow{stroke:#4a7186;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.future{fill:#eef8f4;stroke:#78bca1;stroke-width:2;stroke-dasharray:7 5}</style></defs>
<rect class="bg" width="1200" height="420" rx="22"/>
<text x="55" y="54" class="num">SMART SHELF AI · PIPELINE DE CAPTURA</text>
<text x="55" y="88" style="font:700 27px Arial,sans-serif;fill:#172b40">Da fotografia ao registo auditável</text>
<g transform="translate(45 145)">
<rect class="card" width="205" height="160" rx="16"/><circle cx="35" cy="35" r="18" fill="#e5f4ee"/><text x="35" y="40" text-anchor="middle" class="num">1</text><text x="25" y="82" class="head">Captura</text><text x="25" y="110" class="sub">Câmara ou dispositivo</text><text x="25" y="132" class="sub">envia a fotografia</text>
</g>
<path class="arrow" d="M260 225h40m-10-9 10 9-10 9"/>
<g transform="translate(310 145)">
<rect class="card" width="205" height="160" rx="16"/><circle cx="35" cy="35" r="18" fill="#e5f4ee"/><text x="35" y="40" text-anchor="middle" class="num">2</text><text x="25" y="82" class="head">Validação</text><text x="25" y="110" class="sub">MIME, assinatura e</text><text x="25" y="132" class="sub">limite de tamanho</text>
</g>
<path class="arrow" d="M525 225h40m-10-9 10 9-10 9"/>
<g transform="translate(575 145)">
<rect class="card" width="205" height="160" rx="16"/><circle cx="35" cy="35" r="18" fill="#e5f4ee"/><text x="35" y="40" text-anchor="middle" class="num">3</text><text x="25" y="82" class="head">Armazenamento</text><text x="25" y="110" class="sub">Ficheiro persistente</text><text x="25" y="132" class="sub">e hash SHA-256</text>
</g>
<path class="arrow" d="M790 225h40m-10-9 10 9-10 9"/>
<g transform="translate(840 145)">
<rect class="card" width="155" height="160" rx="16"/><circle cx="35" cy="35" r="18" fill="#e5f4ee"/><text x="35" y="40" text-anchor="middle" class="num">4</text><text x="25" y="82" class="head">Registo</text><text x="25" y="110" class="sub">Metadados</text><text x="25" y="132" class="sub">PENDING</text>
</g>
<path class="arrow" d="M1005 225h35m-10-9 10 9-10 9"/>
<g transform="translate(1045 145)">
<rect class="future" width="130" height="160" rx="16"/><text x="18" y="48" class="num">FASE SEGUINTE</text><text x="18" y="82" class="head">IA / CV</text><text x="18" y="110" class="sub">Deteção de</text><text x="18" y="132" class="sub">produtos</text>
</g>
<text x="55" y="365" class="sub">Estado atual: etapas 1–4 implementadas na API. Inferência visual ainda não implementada.</text>
