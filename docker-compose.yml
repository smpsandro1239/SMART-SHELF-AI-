services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_shelf}
      POSTGRES_USER: ${POSTGRES_USER:-smart_shelf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_only_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smart_shelf} -d ${POSTGRES_DB:-smart_shelf}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-smart_shelf}:${POSTGRES_PASSWORD:-local_only_change_me}@db:5432/${POSTGRES_DB:-smart_shelf}
      IMAGE_STORAGE_PATH: /app/storage/shelf-images
      MAX_IMAGE_UPLOAD_BYTES: ${MAX_IMAGE_UPLOAD_BYTES:-10485760}
      VISION_PROVIDER_FACTORY: ${VISION_PROVIDER_FACTORY:-}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - shelf_images:/app/storage
    depends_on:
      db:
        condition: service_healthy

volumes:
  shelf_images:
  postgres_data:
