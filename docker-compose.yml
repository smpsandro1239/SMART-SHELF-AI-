services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_shelf}
      POSTGRES_USER: ${POSTGRES_USER:-smart_shelf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_only_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smart_shelf} -d ${POSTGRES_DB:-smart_shelf}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-smart_shelf}:${POSTGRES_PASSWORD:-local_only_change_me}@db:5432/${POSTGRES_DB:-smart_shelf}
      IMAGE_STORAGE_PATH: /app/storage/shelf-images
      MAX_IMAGE_UPLOAD_BYTES: ${MAX_IMAGE_UPLOAD_BYTES:-10485760}
      VISION_PROVIDER_FACTORY: ${VISION_PROVIDER_FACTORY:-app.demo.vision:create_provider}
      MOCK_VISION_DETECTION_LABEL: ${MOCK_VISION_DETECTION_LABEL:-empty_facing}
      VISION_DETECTOR_MODEL_PATH: ${VISION_DETECTOR_MODEL_PATH:-/models/shelf-detector.onnx}
      VISION_EMBEDDING_MODEL_PATH: ${VISION_EMBEDDING_MODEL_PATH:-}
      VISION_MODEL_VERSION: ${VISION_MODEL_VERSION:-shelf-onnx-v1}
      VISION_EMBEDDING_MODEL_VERSION: ${VISION_EMBEDDING_MODEL_VERSION:-shelf-embedding-v1}
      VISION_INPUT_SIZE: ${VISION_INPUT_SIZE:-640}
      VISION_CONFIDENCE_THRESHOLD: ${VISION_CONFIDENCE_THRESHOLD:-0.25}
      VISION_MAX_DETECTIONS: ${VISION_MAX_DETECTIONS:-300}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - shelf_images:/app/storage
      - ./apps/api/demo/assets:/app/demo/assets
      - ${VISION_MODELS_DIR:-./models}:/models:ro
    depends_on:
      db:
        condition: service_healthy

  vision-worker:
    build:
      context: ./apps/api
    restart: unless-stopped
    command: ["python", "-m", "app.vision_worker", "--poll-interval", "5"]
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-smart_shelf}:${POSTGRES_PASSWORD:-local_only_change_me}@db:5432/${POSTGRES_DB:-smart_shelf}
      IMAGE_STORAGE_PATH: /app/storage/shelf-images
      VISION_PROCESSING_TIMEOUT_SECONDS: ${VISION_PROCESSING_TIMEOUT_SECONDS:-86400}
      VISION_PROVIDER_FACTORY: ${VISION_PROVIDER_FACTORY:-app.demo.vision:create_provider}
      MOCK_VISION_DETECTION_LABEL: ${MOCK_VISION_DETECTION_LABEL:-empty_facing}
      VISION_DETECTOR_MODEL_PATH: ${VISION_DETECTOR_MODEL_PATH:-/models/shelf-detector.onnx}
      VISION_EMBEDDING_MODEL_PATH: ${VISION_EMBEDDING_MODEL_PATH:-}
      VISION_MODEL_VERSION: ${VISION_MODEL_VERSION:-shelf-onnx-v1}
      VISION_EMBEDDING_MODEL_VERSION: ${VISION_EMBEDDING_MODEL_VERSION:-shelf-embedding-v1}
      VISION_INPUT_SIZE: ${VISION_INPUT_SIZE:-640}
      VISION_CONFIDENCE_THRESHOLD: ${VISION_CONFIDENCE_THRESHOLD:-0.25}
      VISION_MAX_DETECTIONS: ${VISION_MAX_DETECTIONS:-300}
      PRODUCT_MATCHING_MIN_SIMILARITY: ${PRODUCT_MATCHING_MIN_SIMILARITY:-0.90}
      PRODUCT_MATCHING_MIN_MARGIN: ${PRODUCT_MATCHING_MIN_MARGIN:-0.05}
    volumes:
      - shelf_images:/app/storage
      - ${VISION_MODELS_DIR:-./models}:/models:ro
    depends_on:
      db:
        condition: service_healthy


volumes:
  shelf_images:
  postgres_data:
