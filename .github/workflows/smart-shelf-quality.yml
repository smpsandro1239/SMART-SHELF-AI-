name: Smart Shelf quality gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smart-shelf-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests and Python compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install API dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile application modules
        working-directory: apps/api
        run: python -m compileall -q app

      - name: Run API test suite
        working-directory: apps/api
        env:
          APP_ENV: test
          JWT_SECRET_KEY: test-only-secret-not-for-production
        run: python -m pytest -q

  web:
    name: Web TypeScript and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Build web application
        run: npm run build

      - name: Run Impeccable design detector (baseline)
        shell: bash
        run: |
          set +e
          npx --yes impeccable@4.10.0 detect --json src/ > "$RUNNER_TEMP/impeccable-design-audit.json"
          detector_status=$?
          set -e
          if [ "$detector_status" -ne 0 ] && [ "$detector_status" -ne 2 ]; then
            echo "Impeccable detector could not complete (exit $detector_status)." >> "$GITHUB_STEP_SUMMARY"
            exit "$detector_status"
          fi
          echo "Impeccable detector completed. Existing findings are recorded as a non-blocking baseline; exit 2 means findings were detected." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Impeccable baseline
        uses: actions/upload-artifact@v4
        with:
          name: impeccable-design-audit
          path: ${{ runner.temp }}/impeccable-design-audit.json
          if-no-files-found: error
          retention-days: 14
