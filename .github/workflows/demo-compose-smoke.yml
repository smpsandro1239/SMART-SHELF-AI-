name: Demo Docker Compose smoke

on:
  push:
    branches: [main]
    paths:
      - 'docker-compose.yml'
      - 'apps/api/**'
      - 'infra/postgres/**'
      - '.github/workflows/demo-compose-smoke.yml'
  pull_request:
    paths:
      - 'docker-compose.yml'
      - 'apps/api/**'
      - 'infra/postgres/**'
      - '.github/workflows/demo-compose-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-compose-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-smoke:
    name: Docker Compose demo stack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EDGE_SUPERVISOR_HEARTBEAT_TIMEOUT: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and start API, PostgreSQL and vision worker
        run: docker compose up --build -d

      - name: Wait for API readiness and seed demo data
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/health/ready >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [[ "$ready" != "1" ]]; then
            docker compose ps
            docker compose logs --no-color api db
            exit 1
          fi

          docker compose exec -T -e MIGRATION_DB_USER="${POSTGRES_USER:-smart_shelf}" api python -c "import os, runpy; os.environ['RUNTIME_DATABASE_URL'] = os.environ['DATABASE_URL']; runpy.run_path('scripts/postgres_runtime_role_smoke.py', run_name='__main__')"

          # Simulate a legacy persistent volume where runtime accidentally owns a trust table
          # and inherits an unrelated role. The provisioning service must repair both.
          docker compose exec -T db psql --username smart_shelf --dbname smart_shelf --set=ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE legacy_runtime_smoke NOLOGIN;
          GRANT legacy_runtime_smoke TO smart_shelf_runtime;
          ALTER TABLE public.vision_model_release_states OWNER TO smart_shelf_runtime;
          SQL
          docker compose run --rm provision-runtime-role
          docker compose exec -T -e MIGRATION_DB_USER="${POSTGRES_USER:-smart_shelf}" api python -c "import os, runpy; os.environ['RUNTIME_DATABASE_URL'] = os.environ['DATABASE_URL']; runpy.run_path('scripts/postgres_runtime_role_smoke.py', run_name='__main__')"
          docker compose exec -T db psql --username smart_shelf --dbname smart_shelf --set=ON_ERROR_STOP=1 --command="DROP ROLE legacy_runtime_smoke"
          curl --fail --silent http://127.0.0.1:8000/health/ready >/dev/null
          docker compose exec -T api python -m app.demo.seed
          test -s apps/api/demo/assets/synthetic-shelf.png

      - name: Verify worker and all demo profiles
        shell: bash
        run: |
          set -euo pipefail
          services="$(docker compose ps --services --filter status=running)"
          grep -qx 'vision-worker' <<< "$services"

          api_id="$(docker compose ps -q api)"
          worker_id="$(docker compose ps -q vision-worker)"
          api_image_mount_rw="$(docker inspect "$api_id" --format '{{range .Mounts}}{{if eq .Destination "/app/storage"}}{{.RW}}{{end}}{{end}}')"
          api_dataset_mount_rw="$(docker inspect "$api_id" --format '{{range .Mounts}}{{if eq .Destination "/app/storage/dataset-outputs"}}{{.RW}}{{end}}{{end}}')"
          api_image_volume="$(docker inspect "$api_id" --format '{{range .Mounts}}{{if eq .Destination "/app/storage"}}{{.Name}}{{end}}{{end}}')"
          api_dataset_volume="$(docker inspect "$api_id" --format '{{range .Mounts}}{{if eq .Destination "/app/storage/dataset-outputs"}}{{.Name}}{{end}}{{end}}')"
          worker_image_mount_rw="$(docker inspect "$worker_id" --format '{{range .Mounts}}{{if eq .Destination "/app/storage"}}{{.RW}}{{end}}{{end}}')"
          worker_image_volume="$(docker inspect "$worker_id" --format '{{range .Mounts}}{{if eq .Destination "/app/storage"}}{{.Name}}{{end}}{{end}}')"
          worker_dataset_mount="$(docker inspect "$worker_id" --format '{{range .Mounts}}{{if eq .Destination "/app/storage/dataset-outputs"}}present{{end}}{{end}}')"
          test "$api_image_mount_rw" = "true"
          test "$api_dataset_mount_rw" = "true"
          test -n "$api_image_volume"
          test -n "$api_dataset_volume"
          test "$api_image_volume" != "$api_dataset_volume"
          test "$worker_image_mount_rw" = "false"
          test "$worker_image_volume" = "$api_image_volume"
          test -z "$worker_dataset_mount"
          docker compose exec -T api python -c "import os, tempfile; p='/app/storage/dataset-outputs'; assert os.environ['DATASET_OUTPUT_STORAGE_PATH'] == p; assert os.path.isdir(p); f=tempfile.TemporaryFile(dir=p); f.write(b'smoke'); f.close()"
          echo "Verified API read-write dataset volume is separate from shelf_images and is not mounted in vision-worker."

          rootfs_read_only="$(docker inspect "$worker_id" --format '{{.HostConfig.ReadonlyRootfs}}')"
          worker_user="$(docker inspect "$worker_id" --format '{{.Config.User}}')"
          dropped_caps="$(docker inspect "$worker_id" --format '{{join .HostConfig.CapDrop ","}}')"
          security_options="$(docker inspect "$worker_id" --format '{{join .HostConfig.SecurityOpt ","}}')"
          test "$rootfs_read_only" = "true"
          test "$worker_user" = "65532:65532"
          grep -q 'ALL' <<< "$dropped_caps"
          grep -q 'no-new-privileges:true' <<< "$security_options"
          docker compose exec -T vision-worker python -c "import os; assert os.geteuid() == 65532; assert os.access('/tmp', os.W_OK); assert not os.access('/app', os.W_OK); assert not os.access('/app/storage/shelf-images', os.W_OK); assert not os.access('/models', os.W_OK)"
          echo "Verified non-root worker, read-only root filesystem, dropped capabilities, no-new-privileges and writable temporary directory only."

          # The Edge event worker is a separate long-running process, not the vision worker.
          edge_worker_id="$(docker compose ps -q edge-event-worker)"
          test -n "$edge_worker_id"
          edge_state="$(docker inspect "$edge_worker_id" --format '{{.State.Status}}')"
          test "$edge_state" = "running"
          edge_health="$(docker inspect "$edge_worker_id" --format '{{.State.Health.Status}}')"
          test "$edge_health" = "healthy"
          docker compose exec -T edge-event-worker python -m app.edge_event_supervisor --healthcheck
          edge_restart_count_before="$(docker inspect "$edge_worker_id" --format '{{.RestartCount}}')"
          sleep 5
          edge_state_after="$(docker inspect "$edge_worker_id" --format '{{.State.Status}}')"
          edge_restart_count_after="$(docker inspect "$edge_worker_id" --format '{{.RestartCount}}')"
          test "$edge_state_after" = "running"
          test "$edge_restart_count_before" = "$edge_restart_count_after"
          edge_user="$(docker inspect "$edge_worker_id" --format '{{.Config.User}}')"
          edge_rootfs_read_only="$(docker inspect "$edge_worker_id" --format '{{.HostConfig.ReadonlyRootfs}}')"
          edge_dropped_caps="$(docker inspect "$edge_worker_id" --format '{{join .HostConfig.CapDrop ","}}')"
          edge_security_options="$(docker inspect "$edge_worker_id" --format '{{join .HostConfig.SecurityOpt ","}}')"
          edge_command="$(docker inspect "$edge_worker_id" --format '{{json .Config.Cmd}}')"
          test "$edge_user" = "65532:65532"
          test "$edge_rootfs_read_only" = "true"
          grep -q 'ALL' <<< "$edge_dropped_caps"
          grep -q 'no-new-privileges:true' <<< "$edge_security_options"
          grep -q 'app.edge_event_supervisor' <<< "$edge_command"
          docker compose exec -T edge-event-worker python -c "import os; assert os.geteuid() == 65532; assert os.access('/tmp', os.W_OK); assert not os.access('/app', os.W_OK)"
          
          # Kill the actual worker child and prove that the independent supervisor replaces it.
          restart_before="$(docker compose exec -T edge-event-worker python -c "import json; print(json.load(open('/tmp/edge-supervisor-state.json'))['restart_count'])")"
          docker compose exec -T edge-event-worker python -c "import json, os, signal; state=json.load(open('/tmp/edge-supervisor-state.json')); os.kill(state['child_pid'], signal.SIGKILL)"
          recovered=0
          for attempt in $(seq 1 30); do
            restart_after="$(docker compose exec -T edge-event-worker python -c "import json; print(json.load(open('/tmp/edge-supervisor-state.json'))['restart_count'])" 2>/dev/null || echo 0)"
            if [[ "$restart_after" -gt "$restart_before" ]] && docker compose exec -T edge-event-worker python -m app.edge_event_supervisor --healthcheck; then
              recovered=1
              break
            fi
            sleep 1
          done
          test "$recovered" = "1"

          # Freeze the child: its polling heartbeat must become stale and trigger replacement.
          child_pid="$(docker compose exec -T edge-event-worker python -c "import json; print(json.load(open('/tmp/edge-supervisor-state.json'))['child_pid'])")"
          restart_before="$(docker compose exec -T edge-event-worker python -c "import json; print(json.load(open('/tmp/edge-supervisor-state.json'))['restart_count'])")"
          docker compose exec -T edge-event-worker python -c "import os, signal; os.kill($child_pid, signal.SIGSTOP)"
          recovered=0
          for attempt in $(seq 1 30); do
            restart_after="$(docker compose exec -T edge-event-worker python -c "import json; print(json.load(open('/tmp/edge-supervisor-state.json'))['restart_count'])" 2>/dev/null || echo 0)"
            if [[ "$restart_after" -gt "$restart_before" ]] && docker compose exec -T edge-event-worker python -m app.edge_event_supervisor --healthcheck; then
              recovered=1
              break
            fi
            sleep 1
          done
          test "$recovered" = "1"

          # Exercise the real container SIGTERM path and restart the service cleanly.
          docker compose stop --timeout 30 edge-event-worker
          shutdown_logs="$(docker compose logs --no-color edge-event-worker)"
          grep -q 'Supervisor shutdown requested' <<< "$shutdown_logs"
          grep -q 'Edge event worker stopped' <<< "$shutdown_logs"
          docker compose start edge-event-worker
          healthy=0
          for attempt in $(seq 1 30); do
            if docker compose exec -T edge-event-worker python -m app.edge_event_supervisor --healthcheck; then
              healthy=1
              break
            fi
            sleep 1
          done
          test "$healthy" = "1"
          echo "Verified independent Edge supervisor healthcheck, SIGKILL recovery, stale-heartbeat recovery, graceful SIGTERM shutdown/restart, non-root execution and container hardening."

          while IFS='|' read -r role email password; do
            response="$(curl --fail --silent --show-error \
              -H 'Content-Type: application/json' \
              --data "{\"email\":\"$email\",\"password\":\"$password\"}" \
              http://127.0.0.1:8000/api/v1/auth/login)"
            actual_role="$(jq -r '.user.role' <<< "$response")"
            token="$(jq -r '.access_token' <<< "$response")"
            test "$actual_role" = "$role"
            test -n "$token"
            if [[ "$role" == "EMPLOYEE" ]]; then
              status="$(curl --silent --show-error -o /dev/null -w '%{http_code}' \
                -H "Authorization: Bearer $token" \
                http://127.0.0.1:8000/api/v1/stores)"
              test "$status" = "403"
              echo "Authenticated EMPLOYEE and verified store-list access is restricted."
            else
              store_count="$(curl --fail --silent --show-error \
                -H "Authorization: Bearer $token" \
                http://127.0.0.1:8000/api/v1/stores | \
                jq '[.[] | select(.code == "DEMO-BRAGA")] | length')"
              test "$store_count" = "1"
              echo "Authenticated $role and verified Demo Store Braga access."
            fi
          done <<'ACCOUNTS'
          ADMIN|admin@demo.smart-shelf.local|DemoAdmin2026!
          SUPERVISOR|supervisor@demo.smart-shelf.local|DemoSupervisor2026!
          EMPLOYEE|employee@demo.smart-shelf.local|DemoEmployee2026!
          ACCOUNTS

      - name: Collect service logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Stop stack and remove ephemeral volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
