name: API CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - '.github/workflows/api-ci.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - '.github/workflows/api-ci.yml'
  workflow_dispatch:

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smart_shelf_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d smart_shelf_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/api
    env:
      PYTHONPATH: ${{ github.workspace }}/apps/api
      APP_ENV: test
      JWT_SECRET_KEY: test-only-secret-not-for-production
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Smoke-test Alembic migrations on PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/smart_shelf_ci
          APP_ENV: test
        run: alembic upgrade head
      - name: Verify PostgreSQL external artifact disposition audit immutability
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/smart_shelf_ci
          APP_ENV: test
        run: python scripts/postgres_shelf_image_artifact_disposition_smoke.py
      - name: Verify PostgreSQL external artifact read and retention lock serialization
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/smart_shelf_ci
          APP_ENV: test
        run: python scripts/postgres_artifact_consumption_smoke.py
      - name: Verify PostgreSQL task lifecycle, concurrency and reconciliation
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/smart_shelf_ci
          APP_ENV: test
        run: python scripts/postgres_active_task_smoke.py
      - name: Verify PostgreSQL observation-alert concurrency and immutable audit
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/smart_shelf_ci
          APP_ENV: test
        run: python scripts/postgres_observation_alert_smoke.py
      - name: Verify PostgreSQL SKU embedding and image-retention lock serialization
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/smart_shelf_ci
          APP_ENV: test
        run: python scripts/postgres_embedding_retention_smoke.py
      - name: Verify PostgreSQL concurrent SKU exemplar review serialization
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/smart_shelf_ci
          APP_ENV: test
          JWT_SECRET_KEY: test-only-secret-not-for-production
        run: python scripts/postgres_embedding_review_smoke.py
      - name: Verify PostgreSQL four-way SKU matching, retention and human-review concurrency
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/smart_shelf_ci
          APP_ENV: test
          JWT_SECRET_KEY: test-only-secret-not-for-production
        run: python scripts/postgres_four_way_concurrency_smoke.py
      - name: Verify PostgreSQL inventory and warehouse cross-store authorization
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/smart_shelf_ci
          APP_ENV: test
        run: python scripts/postgres_inventory_authorization_smoke.py
      - name: Verify PostgreSQL reviewed SKU evaluation store isolation
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/smart_shelf_ci
          APP_ENV: test
          JWT_SECRET_KEY: test-only-secret-not-for-production
        run: python scripts/postgres_sku_evaluation_authorization_smoke.py
      - name: Verify PostgreSQL capture-session tenant authorization
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/smart_shelf_ci
          APP_ENV: test
          JWT_SECRET_KEY: test-only-secret-not-for-production
        run: python scripts/postgres_capture_session_authorization_smoke.py
      - name: Run tests
        run: pytest -q
