      - name: Verify PostgreSQL store employee directory authorization
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/smart_shelf_ci
          APP_ENV: test
          JWT_SECRET_KEY: test-only-secret-not-for-production
        run: python scripts/postgres_store_employee_authorization_smoke.py
      - name: Verify PostgreSQL review queue and image-retention lock serialization
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/smart_shelf_ci
          APP_ENV: test
