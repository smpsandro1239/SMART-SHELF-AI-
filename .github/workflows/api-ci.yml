name: API CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - '.github/workflows/api-ci.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - '.github/workflows/api-ci.yml'
  workflow_dispatch:

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smart_shelf_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d smart_shelf_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/api
    env:
      PYTHONPATH: ${{ github.workspace }}/apps/api
      APP_ENV: test
      JWT_SECRET_KEY: test-only-secret-not-for-production
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Smoke-test Alembic migrations on PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/smart_shelf_ci
        run: alembic upgrade head
      - name: Verify PostgreSQL vision worker lease recovery and fencing
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/smart_shelf_ci
          APP_ENV: test
        run: python scripts/postgres_vision_worker_recovery_smoke.py
      - name: Verify PostgreSQL concurrent first-admin bootstrap
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/smart_shelf_ci
          APP_ENV: test
        run: python scripts/postgres_admin_bootstrap_concurrency_smoke.py
      - name: Verify PostgreSQL pallet lifecycle event append-only protection
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/smart_shelf_ci
        run: python scripts/postgres_pallet_event_immutability_smoke.py
      - name: Verify PostgreSQL inventory snapshot append-only protection
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/smart_shelf_ci
          APP_ENV: test
        run: python scripts/postgres_inventory_snapshot_immutability_smoke.py
      - name: Verify PostgreSQL inventory movement lineage guard
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/smart_shelf_ci
          APP_ENV: test
        run: python scripts/postgres_inventory_movement_lineage_smoke.py
      - name: Verify PostgreSQL shelf record tenant lineage guard
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/smart_shelf_ci
          APP_ENV: test
        run: python scripts/postgres_shelf_record_lineage_smoke.py
      - name: Verify PostgreSQL dataset eligibility hierarchy lock serialization
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/smart_shelf_ci
          APP_ENV: test
        run: python scripts/postgres_dataset_eligibility_concurrency_smoke.py
      - name: Verify PostgreSQL external artifact disposition audit immutability
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/smart_shelf_ci
          APP_ENV: test
        run: python scripts/postgres_shelf_image_artifact_disposition_smoke.py
      - name: Verify PostgreSQL external artifact lineage immutability
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/smart_shelf_ci
          APP_ENV: test
        run: python scripts/postgres_artifact_lineage_immutability_smoke.py
      - name: Verify PostgreSQL artifact inventory snapshot monotonicity
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/smart_shelf_ci
          APP_ENV: test
        run: python scripts/postgres_artifact_inventory_monotonicity_smoke.py
      - name: Verify PostgreSQL external artifact reference and inventory immutability
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/smart_shelf_ci
          APP_ENV: test
        run: python scripts/postgres_artifact_immutability_smoke.py
      - name: Verify PostgreSQL external artifact read and retention lock serialization
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/smart_shelf_ci
          APP_ENV: test
