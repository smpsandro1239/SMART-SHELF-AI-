name: Smart Shelf security scans

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smart-shelf-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-sca:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Audit API and optional OCR dependencies
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266
        with:
          inputs: apps/api/requirements.txt apps/api/requirements-ocr.txt
          vulnerability-service: osv

  web-sca:
    name: Web dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install lockfile dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit production and development dependency tree
        run: npm audit --audit-level=high

  secret-scan:
    name: Git history secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository history with Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dast-baseline:
    name: OWASP ZAP passive baseline
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Start isolated API and PostgreSQL stack
        run: docker compose up --build -d

      - name: Wait for API readiness
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8000/health/ready >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [[ "$ready" != "1" ]]; then
            docker compose ps
            docker compose logs --no-color api db
            exit 1
          fi

      - name: Run passive ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25
        with:
          target: "http://127.0.0.1:8000/openapi.json"
          allow_issue_writing: false
          fail_action: false

      - name: Import OpenAPI and run safe-mode API baseline
        run: |
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE:/zap/wrk/:rw" \
            -t ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py -S -I \
            -t http://127.0.0.1:8000/openapi.json -f openapi \
            -J zap-api-report.json -w zap-api-report.md -r zap-api-report.html

      - name: Upload OpenAPI baseline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-openapi-baseline
          path: zap-api-report.*
          if-no-files-found: ignore

      - name: Collect API logs on scan failure
        if: failure()
        run: docker compose logs --no-color api db

      - name: Stop isolated stack
        if: always()
        run: docker compose down --volumes --remove-orphans
